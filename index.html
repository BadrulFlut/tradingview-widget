<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #181A20;
    }
    .tradingview-widget-container {
      width: 100vw;
      height: 60vw;
      min-height: 300px;
      max-width: 100vw;
    }
    .tradingview-widget-container__widget {
      width: 100vw !important;
      height: 60vw !important;
      min-height: 300px;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget" id="tv-container"></div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    const symbol = window.location.pathname.substring(1) || "BINANCE:BTCUSDT";

    new TradingView.widget({
      autosize: true,
      symbol: symbol,
      interval: "15",
      timezone: "Asia/Jakarta",
      theme: "dark",
      style: "1",
      locale: "id",
      container_id: "tv-container",
      hide_top_toolbar: true,
      hide_legend: true,
      allow_symbol_change: false,
      save_image: false,
      details: true,
      studies: [],
      hide_volume: true,
      support_host: "https://www.tradingview.com"
    });
  </script>
</body>
</html>
